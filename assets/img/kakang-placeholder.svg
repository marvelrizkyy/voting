<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="kakangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D5A"/>
      <stop offset="60%" stop-color="#101B35"/>
      <stop offset="100%" stop-color="#0A1021"/>
    </linearGradient>
    <linearGradient id="goldSash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D07C"/>
      <stop offset="50%" stop-color="#D6AE58"/>
      <stop offset="100%" stop-color="#9C7221"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#D6AE58" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#101B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#kakangBg)"/>
  <circle cx="200" cy="180" r="160" fill="url(#aura)"/>

  <!-- Ponorogo Pattern Subtle Accent in Background -->
  <g opacity="0.1" stroke="#D6AE58" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="140" stroke-dasharray="8 6"/>
    <circle cx="200" cy="180" r="110"/>
  </g>

  <!-- Kakang Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Shoulders & Beskap Tuxedo Body -->
    <path d="M70 480 C70 380 120 310 200 310 C280 310 330 380 330 480 Z" fill="#141E34"/>
    <path d="M110 480 C110 370 145 325 200 325 C255 325 290 370 290 480 Z" fill="#1A2744"/>

    <!-- Beskap Collar / Neck -->
    <path d="M175 270 L175 325 L225 325 L225 270 Z" fill="#C99E75"/>
    <!-- Beskap Gold Trim -->
    <path d="M197 325 L197 480" stroke="url(#goldSash)" stroke-width="3"/>
    
    <!-- Pageant Gold Sash -->
    <path d="M115 350 L275 480 L310 480 L140 335 Z" fill="url(#goldSash)" opacity="0.95"/>
    <text x="210" y="420" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#101B35" transform="rotate(39 210 420)" letter-spacing="2">KAKANG PONOROGO</text>

    <!-- Head & Face -->
    <ellipse cx="200" cy="225" rx="52" ry="62" fill="#DDB088"/>

    <!-- Blangkon Ponorogo (Traditional Headdress) -->
    <path d="M140 195 C140 135 170 125 200 125 C230 125 260 135 260 195 C250 200 230 185 200 185 C170 185 150 200 140 195 Z" fill="#2C1B14"/>
    <path d="M142 190 C165 175 235 175 258 190" stroke="url(#goldSash)" stroke-width="3" fill="none"/>
    <!-- Mondholan / Back tie of Blangkon -->
    <ellipse cx="200" cy="123" rx="14" ry="9" fill="#1F120D"/>
  </g>

  <!-- Frame border -->
  <rect x="10" y="10" width="380" height="480" fill="none" stroke="url(#goldSash)" stroke-width="1.5" rx="12" opacity="0.4"/>
  <text x="200" y="475" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="url(#goldSash)" letter-spacing="3">CALON KAKANG</text>
</svg>

